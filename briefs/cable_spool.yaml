name: cable_spool
function: >
  Wall-mounted cable winder: a back flange on the wall, a hollow hub to wind cable around, and
  retaining lip tabs at the hub's free end that keep the coil from sliding off. A single M4 screw in
  the hub's floor mounts it, reached through the open hub. A notch in the flange parks the cable end.
  Prints wall-side down without supports; the lip is separate tabs with self-supporting undersides.
hard_dimensions: {flange_dia: 90, spool_height: 40, mount_holes: 1}
measures:
  flange_dia: {probe: bbox_x}
  spool_height: {probe: bbox_z}
  mount_holes: {probe: hole_count, axis: Z, dia: 4.5}
interfaces:
  - "Wall: flat face z=0, 1x M4 counterbored screw on the axis, driven through the open hub"
  - "Cable: wound on the hub between the flange and the lip tabs; end parked in the flange notch"
soft_preferences: [No supports, Radius where the hub meets the flange, Rounded flange edge]
assumptions:
  - "RETAINING LIP IS TABS, NOT A FULL RING. Each tab's underside is a 44 deg self-supporting cone, but it still counts as downward-facing, and a full ring reads well over the 15 % overhang limit. Gaps between tabs also let a hand reach the coil."
  - "A single centre screw lets the spool turn on the wall if over-torqued by a pull. No anti-rotation key; the brief asks for a centre screw only."
  - "Coil capacity is not a hard dimension and is not measured. Tab reach and spacing, retention, and cable pull load are unverified on a real print."
  - "Wall anchors are the installer's choice."
params:
  flange_dia: {value: 90.0, min: 80.0, max: 130.0, unit: mm, intent: Back flange diameter; sets coil outer limit}
  hub_dia: {value: 50.0, min: 36.0, max: 60.0, unit: mm, intent: Hub outside diameter; keep above the cable's minimum bend}
  spool_height: {value: 40.0, min: 28.0, max: 60.0, unit: mm, intent: Overall height off the wall}
  flange_t: {value: 6.0, min: 5.2, max: 8.0, unit: mm, intent: Flange thickness; leaves at least 1 mm under the M4 head}
  wall: {value: 3.0, min: 2.0, max: 4.0, unit: mm, intent: Hub wall}
  lip_reach: {value: 7.0, min: 4.0, max: 10.0, unit: mm, intent: Tab reach past the hub; held to half the coil width on large hubs}
  lip_arc: {value: 50.0, min: 30.0, max: 70.0, unit: deg, intent: Angular width of each tab}
  lip_count: {value: 3, min: 2, max: 4, unit: count, intent: Number of tabs round the hub}
  notch_w: {value: 4.0, min: 3.0, max: 6.0, unit: mm, intent: Cable-end notch width in the flange rim}
